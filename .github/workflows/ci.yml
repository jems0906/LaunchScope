name: LaunchScope CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: launchscope
          POSTGRES_USER: launchscope
          POSTGRES_PASSWORD: launchscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launchscope -d launchscope"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:vendor
      DATABASE_URL: postgresql+psycopg://launchscope:launchscope@localhost:5432/launchscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f backend/Dockerfile -t launchscope-api:ci .
      - run: docker build -f frontend/Dockerfile -t launchscope-frontend:ci .

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: launchscope-e2e
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_ANALYST_USERNAME: e2e-analyst
      E2E_ANALYST_PASSWORD: ci-only-analyst-password
      E2E_REVIEWER_USERNAME: e2e-reviewer
      E2E_REVIEWER_PASSWORD: ci-only-reviewer-password
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure disposable E2E accounts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import secrets

          def password_hash(password: str) -> str:
              salt = secrets.token_bytes(16)
              digest = hashlib.scrypt(
                  password.encode(), salt=salt, n=2**14, r=8, p=1,
                  dklen=64, maxmem=64 * 1024 * 1024,
              )
              return f"scrypt:{salt.hex()}:{digest.hex()}"

          values = {
              "SESSION_SECRET": secrets.token_urlsafe(48),
              "ANALYST_USERNAME": os.environ["E2E_ANALYST_USERNAME"],
              "ANALYST_PASSWORD_HASH": password_hash(os.environ["E2E_ANALYST_PASSWORD"]),
              "REVIEWER_USERNAME": os.environ["E2E_REVIEWER_USERNAME"],
              "REVIEWER_PASSWORD_HASH": password_hash(os.environ["E2E_REVIEWER_PASSWORD"]),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for key, value in values.items():
                  environment.write(f"{key}={value}\n")
          PY
      - name: Start disposable PostgreSQL and application stack
        run: docker compose up --build -d
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect application logs
        if: always()
        run: docker compose logs --no-color api frontend
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchscope-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Remove disposable stack and database
        if: always()
        run: docker compose down -v