services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launchscope
      POSTGRES_USER: launchscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchscope-demo}
    volumes:
      - launchscope-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchscope -d launchscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://launchscope:${POSTGRES_PASSWORD:-launchscope-demo}@db:5432/launchscope
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-}
      ANALYST_PASSWORD_HASH: ${ANALYST_PASSWORD_HASH:-}
      REVIEWER_USERNAME: ${REVIEWER_USERNAME:-}
      REVIEWER_PASSWORD_HASH: ${REVIEWER_PASSWORD_HASH:-}
      CORS_ORIGINS: http://localhost:4173
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:80"
    depends_on:
      - api

volumes:
  launchscope-data: